name: Deploy Demo

on:
  workflow_dispatch:
  release:
    types: [ released ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'app/**'
      - 'kmpalette-core/**'
      - 'kmpalette-loader/**'
      - 'extensions-*/**'
      - 'androidx-palette/**'
      - 'gradle/**'
      - '.github/workflows/deploy-demo.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'kmpalette-core/**'
      - 'kmpalette-loader/**'
      - 'extensions-*/**'
      - 'androidx-palette/**'
      - 'gradle/**'
      - '.github/workflows/deploy-demo.yml'

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: "Publish Demo"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build browser distribution
        run: ./gradlew :app:web:composeCompatibilityBrowserDistribution --scan

      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy app/web/build/dist/composeWebCompatibility/productionExecutable
            --project-name=kmpalette-demo
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Summary
        run: |
          echo "Deployed branch \`${{ github.head_ref || github.ref_name }}\` to ${{ steps.publish.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
